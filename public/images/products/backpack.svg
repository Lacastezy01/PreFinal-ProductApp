<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <rect width="400" height="300" fill="#FFFDF2"/>
  <!-- Top Handle -->
  <path d="M165 75 C165 45, 235 45, 235 75" fill="none" stroke="#111111" stroke-width="12" stroke-linecap="round"/>
  <!-- Backpack Main Bag -->
  <path d="M125 100 C125 70, 275 70, 275 100 L285 240 C285 255, 115 255, 115 240 Z" fill="#FF168B" stroke="#111111" stroke-width="6"/>
  <!-- Front Zipper Pocket -->
  <rect x="135" y="160" width="130" height="75" rx="14" fill="#36DDE5" stroke="#111111" stroke-width="5"/>
  <!-- Zipper line -->
  <line x1="145" y1="175" x2="255" y2="175" stroke="#111111" stroke-width="4" stroke-linecap="round"/>
  <!-- Keychain mascot dangling -->
  <circle cx="250" cy="195" r="8" fill="#FFF16A" stroke="#111111" stroke-width="3"/>
  <!-- Side buckles -->
  <rect x="110" y="140" width="12" height="25" rx="4" fill="#FFB83F" stroke="#111111" stroke-width="3"/>
  <rect x="278" y="140" width="12" height="25" rx="4" fill="#FFB83F" stroke="#111111" stroke-width="3"/>
</svg>
