  <circle cx="295" cy="180" r="4" fill="#111111"/>
  <circle cx="305" cy="180" r="4" fill="#111111"/>
  <path d="M296 190 Q300 195 304 190" stroke="#111111" stroke-width="3" fill="none"/>
  <!-- Sound waves -->
