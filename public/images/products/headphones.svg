  <path d="M100 170 C100 60, 300 60, 300 170" fill="none" stroke="#FF168B" stroke-width="8" stroke-linecap="round"/>
  <!-- Cushions & Ear cups -->
  <rect x="70" y="140" width="55" height="95" rx="25" fill="#36DDE5" stroke="#111111" stroke-width="6"/>
  <rect x="80" y="155" width="20" height="65" rx="10" fill="#FFF16A" stroke="#111111" stroke-width="4"/>
  <rect x="275" y="140" width="55" height="95" rx="25" fill="#36DDE5" stroke="#111111" stroke-width="6"/>
  <rect x="300" y="155" width="20" height="65" rx="10" fill="#FFF16A" stroke="#111111" stroke-width="4"/>
