  <rect x="135" y="155" width="20" height="40" rx="10" fill="#62D99A" stroke="#111111" stroke-width="4"/>
  <rect x="245" y="155" width="20" height="40" rx="10" fill="#62D99A" stroke="#111111" stroke-width="4"/>
  <rect x="170" y="222" width="22" height="35" rx="10" fill="#FFB83F" stroke="#111111" stroke-width="5"/>
  <rect x="208" y="222" width="22" height="35" rx="10" fill="#FFB83F" stroke="#111111" stroke-width="5"/>
</svg>
