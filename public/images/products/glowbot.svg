  <circle cx="200" cy="140" r="100" fill="#FFF16A"/>
  <!-- Glowbot Figure -->
  <!-- Antenna -->
  <line x1="200" y1="40" x2="200" y2="70" stroke="#111111" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="35" r="10" fill="#FF168B" stroke="#111111" stroke-width="4"/>
  <!-- Head -->
  <rect x="155" y="70" width="90" height="70" rx="18" fill="#62D99A" stroke="#111111" stroke-width="6"/>
